name: Malta Source Smoke

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Policy scope to exercise
        required: true
        default: research
        type: choice
        options:
          - research
          - poc
      source:
        description: Optional exact source_key
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery kernel
        run: python -m pip install -e './services/discovery[dev]'
      - name: Run governed source smoke
        env:
          SOURCE_SCOPE: ${{ inputs.scope }}
          SOURCE_KEY: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE_KEY" ]; then
            python services/discovery/scripts/live_source_smoke.py --scope "$SOURCE_SCOPE" --source "$SOURCE_KEY" | tee source-smoke.json
          else
            python services/discovery/scripts/live_source_smoke.py --scope "$SOURCE_SCOPE" | tee source-smoke.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-smoke-${{ github.run_id }}
          path: source-smoke.json
          retention-days: 14

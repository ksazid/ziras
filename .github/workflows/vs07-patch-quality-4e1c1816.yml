name: VS-07 Patch Residual Quality Defects

on:
  push:
    branches:
      - ops/vs07-patch-quality-4e1c1816

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vs07-day1-quality-hardening
          fetch-depth: 0

      - name: Apply bounded residual fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('services/discovery/src/ziras_discovery/adapters/public_web.py')
          text = adapter.read_text(encoding='utf-8')
          old_re = '_MONEY_RE = re.compile(r"(?:(?:€|EUR)\\s*)?(\\d{1,4}(?:[.,]\\d{1,2})?)\\s*(?:€|EUR)?", re.IGNORECASE)'
          new_re = '''_MONEY_RE = re.compile(\n    r"(?:(?:€|EUR)\\s*(?P<prefix>\\d{1,4}(?:[.,]\\d{1,2})?)|"\n    r"(?P<suffix>\\d{1,4}(?:[.,]\\d{1,2})?)\\s*(?:€|EUR))",\n    re.IGNORECASE,\n)'''
          if old_re not in text:
              raise SystemExit('expected money regex not found')
          text = text.replace(old_re, new_re, 1)
          old_group = 'raw = match.group(1).replace(",", ".")'
          new_group = 'raw = (match.group("prefix") or match.group("suffix")).replace(",", ".")'
          if old_group not in text:
              raise SystemExit('expected money group extraction not found')
          text = text.replace(old_group, new_group, 1)
          adapter.write_text(text, encoding='utf-8')

          ingestion = Path('services/discovery/scripts/run_poc_ingestion.py')
          text = ingestion.read_text(encoding='utf-8')
          old_ranked = 'for item in summary.ranked[:100]'
          if old_ranked not in text:
              raise SystemExit('expected ranked serialization cap not found')
          text = text.replace(old_ranked, 'for item in summary.ranked', 1)
          ingestion.write_text(text, encoding='utf-8')

          test_file = Path('services/discovery/tests/test_vs07_day1_quality.py')
          test_file.write_text('''from decimal import Decimal\n\nfrom ziras_discovery.adapters.public_web import _money_values\n\n\ndef test_money_parser_ignores_attendee_counts_next_to_real_price() -> None:\n    line = "Spend €35 and receive admission for 1 adult and 2 children"\n    assert _money_values(line) == [Decimal("35")]\n\n\ndef test_money_parser_accepts_prefix_and_suffix_currency() -> None:\n    assert _money_values("€24.00 now 18.00 EUR") == [Decimal("24.00"), Decimal("18.00")]\n''', encoding='utf-8')
          PY

      - name: Commit source fixes to PR branch
        shell: bash
        run: |
          git config user.name "Sazid"
          git config user.email "47315271+ksazid@users.noreply.github.com"
          git add services/discovery/src/ziras_discovery/adapters/public_web.py \
                  services/discovery/scripts/run_poc_ingestion.py \
                  services/discovery/tests/test_vs07_day1_quality.py
          git diff --cached --check
          git commit -m "fix(VS-07): close residual audit quality gaps"
          git push origin HEAD:fix/vs07-day1-quality-hardening

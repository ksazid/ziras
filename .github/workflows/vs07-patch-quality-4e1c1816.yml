name: VS-07 Patch Residual Quality Defects

on:
  push:
    branches:
      - ops/vs07-patch-quality-4e1c1816

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vs07-day1-quality-hardening
          fetch-depth: 0

      - name: Prevent decimal prefix truncation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('services/discovery/src/ziras_discovery/adapters/public_web.py')
          text = adapter.read_text(encoding='utf-8')
          old_re = '''_MONEY_RE = re.compile(\n    r"(?P<decimal>\\d{1,4}[.,]\\d{1,2})|"\n    r"(?:(?:€|EUR)\\s*(?P<prefix_int>\\d{1,4})|"\n    r"(?P<suffix_int>\\d{1,4})\\s*(?:€|EUR))",\n    re.IGNORECASE,\n)'''
          new_re = '''_MONEY_RE = re.compile(\n    r"(?P<decimal>\\d{1,4}[.,]\\d{1,2})|"\n    r"(?:(?:€|EUR)\\s*(?P<prefix_int>\\d{1,4})(?![.,]\\d)|"\n    r"(?P<suffix_int>\\d{1,4})(?![.,]\\d)\\s*(?:€|EUR))",\n    re.IGNORECASE,\n)'''
          if old_re not in text:
              raise SystemExit('expected current money regex not found')
          adapter.write_text(text.replace(old_re, new_re, 1), encoding='utf-8')
          PY

      - name: Commit parser refinement to PR branch
        shell: bash
        run: |
          git config user.name "Sazid"
          git config user.email "47315271+ksazid@users.noreply.github.com"
          git add services/discovery/src/ziras_discovery/adapters/public_web.py
          git diff --cached --check
          git commit -m "fix(VS-07): prevent decimal price truncation"
          git push origin HEAD:fix/vs07-day1-quality-hardening

name: Malta POC Ingestion

on:
  schedule:
    # 08:17 Europe/Malta during the approved 2026-09-01..2026-09-14 POC window.
    - cron: '17 6 1-14 9 *'
  workflow_dispatch:
    inputs:
      scope:
        description: Approved non-production policy scope
        required: true
        default: poc
        type: choice
        options:
          - poc
          - research
      source:
        description: Optional exact source_key
        required: false
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SCOPE: ${{ github.event_name == 'schedule' && 'poc' || inputs.scope }}
      SOURCE_KEY: ${{ github.event_name == 'schedule' && '' || inputs.source }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce approved scheduler window
        id: window
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(date -u +%F)"
          if [[ "$today" < "2026-09-01" || "$today" > "2026-09-14" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside approved VS-07 scheduler window: $today"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'

      - name: Install discovery acquisition stack
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -e './services/discovery[dev,acquisition]'

      - name: Install Chromium for browser fallback
        if: steps.window.outputs.active == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Build PostgreSQL 16 with PostGIS and pgvector
        if: steps.window.outputs.active == 'true'
        run: docker build -t ziras-discovery-postgres services/discovery/tests/postgres

      - name: Start ephemeral POC PostgreSQL
        if: steps.window.outputs.active == 'true'
        run: |
          docker run --rm -d --name ziras-poc-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ziras \
            -p 5432:5432 \
            ziras-discovery-postgres
          for i in {1..30}; do
            if docker exec ziras-poc-postgres pg_isready -U postgres -d ziras; then
              exit 0
            fi
            sleep 1
          done
          docker logs ziras-poc-postgres
          exit 1

      - name: Run governed POC ingestion
        if: steps.window.outputs.active == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ziras
        run: |
          set -o pipefail
          if [ -n "$SOURCE_KEY" ]; then
            python services/discovery/scripts/run_poc_ingestion.py \
              --scope "$SOURCE_SCOPE" \
              --source "$SOURCE_KEY" \
              --apply-migrations | tee poc-ingestion.json
          else
            python services/discovery/scripts/run_poc_ingestion.py \
              --scope "$SOURCE_SCOPE" \
              --apply-migrations | tee poc-ingestion.json
          fi

      - name: Record immutable run provenance
        if: always() && steps.window.outputs.active == 'true'
        env:
          POC_SCOPE: ${{ env.SOURCE_SCOPE }}
          POC_SOURCE: ${{ env.SOURCE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "schema_version": 1,
              "github_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_ref": os.environ["GITHUB_REF"],
              "scope": os.environ.get("POC_SCOPE", ""),
              "source": os.environ.get("POC_SOURCE", ""),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("poc-run-provenance.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.active == 'true'
        with:
          name: poc-ingestion-${{ github.run_id }}
          path: |
            poc-ingestion.json
            poc-run-provenance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop POC PostgreSQL
        if: always() && steps.window.outputs.active == 'true'
        run: docker stop ziras-poc-postgres || true
